[project]
name = "alphax_hospitality"
version = "1.0.0"
description = "Hotel PMS for ERPNext v15 - front desk, folios, night audit, ZATCA"
authors = [{ name = "Neotec Integrated Solution", email = "erpsupport@neotec.ai" }]
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "alphax_hospitality"

# Frappe Cloud reads this to decide whether the app can join a bench.
# Without it the Add App dialog refuses with "Could not find compatible
# Frappe version in pyproject.toml".
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
